<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <g fill="#203383">
    <!-- Emblem Circle & Gate -->
    <g transform="translate(20, 10)">
      <circle cx="95" cy="95" r="85" fill="none" stroke="#203383" stroke-width="4"/>
      <circle cx="95" cy="95" r="75" fill="none" stroke="#203383" stroke-width="2"/>
      <path d="M 30,120 Q 95,145 160,120 L 160,150 Q 95,175 30,150 Z" fill="#203383"/>
      <!-- Inner Temple Tower / Gopuram -->
      <path d="M 80,115 L 80,95 L 85,95 L 85,75 L 90,75 L 90,60 L 100,60 L 100,75 L 105,75 L 105,95 L 110,95 L 110,115 Z" fill="#203383"/>
      <text x="95" y="45" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#203383">VELLORE INSTITUTE OF TECH</text>
      <text x="95" y="140" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">உழைப்பே உயர்வு தரும்</text>
    </g>
    <!-- VIT Big Letters -->
    <text x="280" y="125" font-family="'Times New Roman', Georgia, serif" font-size="130" font-weight="900" letter-spacing="4" fill="#203383">VIT</text>
    <circle cx="600" cy="40" r="10" fill="none" stroke="#203383" stroke-width="2"/>
    <text x="600" y="44" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#203383">R</text>
    <!-- Divider bar -->
    <rect x="230" y="145" width="450" height="4" fill="#203383"/>
    <!-- Subtitles -->
    <text x="455" y="180" font-family="'Times New Roman', Georgia, serif" font-size="28" font-weight="bold" letter-spacing="0.5" text-anchor="middle" fill="#203383">Vellore Institute of Technology</text>
    <text x="455" y="210" font-family="'Times New Roman', Georgia, serif" font-size="16" font-style="italic" text-anchor="middle" fill="#203383">(Deemed to be University under section 3 of UGC Act, 1956)</text>
  </g>
</svg>
