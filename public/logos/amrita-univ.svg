<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 240" width="100%" height="100%">
  <!-- Emblem Conch & Lotus -->
  <g transform="translate(10, 10)">
    <circle cx="80" cy="80" r="70" fill="none" stroke="#A60C38" stroke-width="4"/>
    <!-- Lotus & Conch Shell Motif -->
    <path d="M 50,110 Q 80,80 110,110 Q 80,130 50,110 Z" fill="#A60C38"/>
    <circle cx="80" cy="50" r="14" fill="#A60C38"/>
    <path d="M 75,50 Q 80,30 85,50 Z" fill="#A60C38"/>
    <!-- Banner Ribbon -->
    <path d="M 20,135 L 140,135 L 130,155 L 30,155 Z" fill="#A60C38"/>
    <text x="80" y="148" font-family="'Times New Roman', serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#ffffff">अमृत विश्व विद्यापीठम्</text>
    <text x="80" y="175" font-family="'Times New Roman', serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#A60C38">श्रद्धावान् लभते ज्ञानम्</text>
  </g>
  <!-- AMRITA Main Text -->
  <text x="460" y="135" font-family="'Times New Roman', Georgia, serif" font-size="120" font-weight="900" letter-spacing="8" text-anchor="middle" fill="#A60C38">AMRITA</text>
  <!-- Subtitles -->
  <text x="460" y="175" font-family="'Times New Roman', Georgia, serif" font-size="34" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#A60C38">VISHWA VIDYAPEETHAM</text>
  <text x="460" y="210" font-family="'Times New Roman', Georgia, serif" font-size="19" letter-spacing="2" text-anchor="middle" fill="#A60C38">DEEMED TO BE UNIVERSITY UNDER SECTION 3 OF UGC ACT, 1956</text>
</svg>
