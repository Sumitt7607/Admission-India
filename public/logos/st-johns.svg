<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 220" width="100%" height="100%">
  <!-- St. Johns Emblem -->
  <g transform="translate(30, 15)">
    <circle cx="95" cy="95" r="85" fill="#1A365D" stroke="#D69E2E" stroke-width="4"/>
    <circle cx="95" cy="95" r="75" fill="#ffffff" />
    <!-- Eagle / Book / Cross Motif -->
    <path d="M 65,80 Q 95,60 125,80 L 125,120 Q 95,100 65,120 Z" fill="#D69E2E"/>
    <rect x="91" y="55" width="8" height="60" fill="#1A365D" rx="2"/>
    <rect x="75" y="70" width="40" height="8" fill="#1A365D" rx="2"/>
    <text x="95" y="150" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1A365D">HE SHALL HEAL THEM</text>
  </g>
  <!-- Text Block -->
  <text x="215" y="75" font-family="'Times New Roman', Georgia, serif" font-size="46" font-weight="bold" fill="#1A365D" letter-spacing="1.5">ST. JOHN'S</text>
  <line x1="215" y1="92" x2="620" y2="92" stroke="#D69E2E" stroke-width="3" />
  <text x="215" y="128" font-family="'Times New Roman', Georgia, serif" font-size="22" font-weight="bold" fill="#333333">Medical College &amp; Hospital</text>
  <text x="215" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#718096" letter-spacing="1.5">BANGALORE • TOP 15 MEDICAL</text>
</svg>
